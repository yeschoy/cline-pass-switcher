# All-in-one 部署：应用 + Caddy 自动 HTTPS
# 用法：
#   1. mkdir -p data && cp config.example.json data/config.json  （填入你的账号 key）
#   2. 仓库外私有 env 文件（0600）提供 CPASS_DOMAIN、CPASS_PUBLIC_ORIGIN=https://同域名、
#      CPASS_ADMIN_PROXY_TOKEN（openssl rand -hex 32；供 Caddy 和应用共享，不能交给模型客户端），
#      首次启动还需 CLINE_PASS_ADMIN_BOOTSTRAP=1 和独立 CLINE_PASS_ADMIN_INIT_CODE；空客户端密钥另需初始密码。
#   3. docker compose --env-file /path/to/private-admin.env -f deploy/docker-compose.all-in-one.yml up -d --build
#      确保实际 TLS 证书受信；无域名时 CPASS_DOMAIN/CPASS_PUBLIC_ORIGIN 须与访问 IP 一致。
services:
  app:
    build: ..
    container_name: cline-pass-console
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - BIND_HOST=0.0.0.0
      - PUBLIC_BASE_URL=${CPASS_PUBLIC_ORIGIN:-}
      - CLINE_PASS_ADMIN_PROXY_TOKEN=${CPASS_ADMIN_PROXY_TOKEN:?set a private 64-hex reverse proxy token}
      - CLINE_PASS_ADMIN_BOOTSTRAP=${CLINE_PASS_ADMIN_BOOTSTRAP:-}
      - CLINE_PASS_ADMIN_INIT_CODE=${CLINE_PASS_ADMIN_INIT_CODE:-}
      - CLINE_PASS_ADMIN_INITIAL_PASSWORD=${CLINE_PASS_ADMIN_INITIAL_PASSWORD:-}
    volumes:
      - ../data:/data
    expose:
      - "3123"

  caddy:
    image: caddy:2-alpine
    container_name: cline-pass-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CPASS_DOMAIN=${CPASS_DOMAIN:-}
      - CPASS_ADMIN_PROXY_TOKEN=${CPASS_ADMIN_PROXY_TOKEN:?set a private 64-hex reverse proxy token}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
